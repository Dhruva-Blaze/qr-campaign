<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Loan Inquiry</title><link rel="stylesheet" href="css/style.css"></head><body><main class="container"><div class="brand"><h1>Home Loan Inquiry</h1><p>Fill your details to continue and take your festive photo.</p></div><form id="inquiryForm" class="card grid"><div class="input-group"><label>Name *</label><input id="name" required></div><div class="input-group"><label>Contact Number *</label><input id="mobile" inputmode="tel" required></div><div class="input-group"><label>City *</label><input id="city" required></div><div class="input-group"><label>Are you looking for a Home Loan? *</label><div class="radio-row"><label><input type="radio" name="loan" value="Yes" required> Yes</label><label><input type="radio" name="loan" value="No"> No</label></div></div><div id="loanFields" class="conditional full"><div class="input-group"><label>Purpose of Loan *</label><select id="purpose"><option value="">Select purpose</option><option>Home Purchase</option><option>Home Construction</option><option>Home Extension</option><option>Home Renovation</option><option>Plot Purchase + Construction</option><option>Loan Against Property</option></select></div><div class="input-group"><label>Loan Amount Required *</label><input id="amount"></div><div class="input-group"><label>Occupation *</label><input id="occupation"></div></div><div class="full"><button class="primary" type="submit">Continue to Camera</button></div><div id="msg" class="full message"></div></form></main><script src="js/config.js"></script><script>const radios=document.querySelectorAll('input[name=loan]'),box=document.getElementById('loanFields');function update(){let y=document.querySelector('input[name=loan]:checked')?.value==='Yes';box.classList.toggle('show',y);['purpose','amount','occupation'].forEach(id=>document.getElementById(id).required=y)}radios.forEach(x=>x.onchange=update);document.getElementById('inquiryForm').onsubmit=e=>{e.preventDefault();let loan=document.querySelector('input[name=loan]:checked').value;localStorage.setItem('inquiry',JSON.stringify({name:name.value.trim(),mobile:mobile.value.trim(),city:city.value.trim(),looking_for_home_loan:loan,loan_purpose:loan==='Yes'?purpose.value:'',loan_amount:loan==='Yes'?amount.value:'',occupation:loan==='Yes'?occupation.value:''}));location.href='camera.html'};</script></body></html>
