<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="css/style.css"></head><body><main class="container"><section id="loginBox" class="card login-card"><h1>Admin Login</h1><div class="input-group"><label>Username</label><input id="username" autocomplete="username"></div><br><div class="input-group"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><br><button id="login" class="primary">Login</button><p id="loginMsg" class="message"></p></section><section id="dashboard" hidden><div class="topbar"><div><h1>Admin Dashboard</h1><p class="small">Manage all inquiries.</p></div><button id="logout" class="secondary">Logout</button></div><div class="stats"><div class="stat">Total Inquiries<strong id="total">0</strong></div><div class="stat">Today's Inquiries<strong id="today">0</strong></div><div class="stat">Total Photos<strong id="photos">0</strong></div></div><br><div class="card table-wrap"><table class="table"><thead><tr><th>Photo</th><th>Name</th><th>Contact</th><th>City</th><th>Home Loan</th><th>Purpose</th><th>Amount</th><th>Occupation</th><th>Date</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="js/config.js"></script><script src="js/admin.js"></script></body></html>
