<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Photo</title><link rel="stylesheet" href="css/style.css"></head><body><main class="container"><div class="card" style="text-align:center"><h1>Your Photo is Ready!</h1><p>Download your image or save the inquiry.</p><img id="img" class="preview-img"><div class="actions" style="justify-content:center"><button id="download" class="primary">Download Image</button><button id="save" class="secondary">Save Inquiry</button><a class="secondary button" href="index.html">New Inquiry</a></div><p id="msg" class="message"></p></div></main><script src="js/config.js"></script><script>const photo=localStorage.getItem('photoData'),inquiry=JSON.parse(localStorage.getItem('inquiry')||'null');const img=document.getElementById('img');if(!photo||!inquiry)location.href='index.html';img.src=photo;download.onclick=()=>{const a=document.createElement('a');a.href=photo;a.download='ganesh-photo.png';a.click()};save.onclick=async()=>{const m=document.getElementById('msg');m.textContent='Saving...';try{const r=await fetch(APP_CONFIG.API_BASE_URL+'/api/inquiries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...inquiry,selected_frame:localStorage.getItem('selectedFrame'),image:photo})});const d=await r.json();if(!r.ok)throw new Error(d.message||'Could not save');m.textContent='Inquiry saved successfully.'}catch(e){m.textContent=e.message+' Check API URL in js/config.js.'}};</script></body></html>
